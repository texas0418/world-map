<!doctype html><meta charset="utf-8"><title>All Features Test</title><style>iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style><body></body>
<script>
const sleep = ms => new Promise(r => setTimeout(r, ms)), R = { errs: [] }; let f, w, d;
const load = async (u = '../index.html?t=' + Date.now() + '#spin=0') => { if (f) f.remove(); f = document.createElement('iframe'); f.src = u; document.body.append(f); await new Promise(r => f.onload = r); w = f.contentWindow; d = f.contentDocument; w.addEventListener('error', e => R.errs.push(String(e.message).slice(0, 120))); w.addEventListener('unhandledrejection', e => R.errs.push('rej ' + String(e.reason).slice(0, 120))); let n = 0; while (!(w.WM && w.WM.sunVector) && n++ < 400) await sleep(50); await sleep(150); };
const $ = i => d.getElementById(i), stat = () => $('nC').textContent + '/' + $('nS').textContent + '/' + $('nP').textContent, cur = () => w.WM.current;
const step = async (k, fn) => { try { R[k] = await fn(); } catch (e) { R[k] = 'FAIL ' + String(e && e.message || e).slice(0, 160); } };
const glErr = () => d.getElementById('gl').getContext('webgl2').getError();
const edit = async (name, v) => { $('addOpen').click(); [...d.querySelectorAll('.tabs button')].find(b => b.dataset.t === 'd').click(); $('dq').value = name; $('dq').dispatchEvent(new w.Event('input')); await sleep(30); $('dlist').querySelector('.act').click(); await sleep(60); if ('note' in v) $('fNote').value = v.note; if ('cat' in v) $('fCat').value = v.cat; if ('date' in v) $('fDate').value = v.date; if ('trip' in v) $('fTrip').value = v.trip; if ('want' in v) $('fWant').checked = v.want; $('pinf').dispatchEvent(new w.Event('submit', { cancelable: true })); await sleep(180); $('edClose').click(); };
(async () => {
  await load(); w.localStorage.clear(); await load(); R.start = stat();
  await step('tabs', async () => { $('addOpen').click(); const n = d.querySelectorAll('.tabs button').length; $('edClose').click(); return n; });
  await step('notesCatsDates', async () => { await edit('Atlanta', { note: 'Home base', cat: 'Work', date: '2024-06', trip: 'T1' }); await edit('Houston', { cat: 'Food', date: '2025', trip: 'T1' }); const p = cur().places.find(x => x.name === 'Atlanta'); return [p.note, p.category, p.date, p.trip, stat()]; });
  await step('badDate', async () => { $('addOpen').click(); [...d.querySelectorAll('.tabs button')].find(b => b.dataset.t === 'd').click(); $('dq').value = 'Tucson'; $('dq').dispatchEvent(new w.Event('input')); await sleep(30); $('dlist').querySelector('.act').click(); await sleep(50); $('fDate').value = 'June'; $('pinf').dispatchEvent(new w.Event('submit', { cancelable: true })); await sleep(50); const stay = !$('pinf').hidden; $('fCancel').click(); $('edClose').click(); return stay && !cur().places.find(x => x.name === 'Tucson').date; });
  await step('filter', async () => { $('optOpen').click(); $('opCat').value = 'Work'; $('opCat').dispatchEvent(new w.Event('change')); await sleep(150); const a = w.__worldMap().onScreen; $('opCat').value = ''; $('opCat').dispatchEvent(new w.Event('change')); await sleep(150); return [a, w.__worldMap().onScreen > 50]; });
  await step('arcs', async () => { $('swArc').click(); await sleep(250); const note = $('arcNote').textContent; $('swArc').click(); return [note, w.WM.view.arcs, glErr()]; });
  await step('replay', async () => { $('rpGo').click(); await sleep(60); const hid = $('op').hidden, a = w.WM.view.maxRank; await sleep(700); const b = w.WM.view.maxRank, first = $('rpName').textContent, sub = $('rpSub').textContent; $('rpStop').click(); await sleep(50); return { hid, grew: b > a, first, sub, stopped: w.WM.view.maxRank === null, msg: $('rpMsg').hidden }; });
  await step('sun', async () => { const v = w.WM.sunVector(Date.UTC(2027, 2, 20, 12, 0, 0)), j = w.WM.sunVector(Date.UTC(2027, 5, 21, 12)); return [v.map(x => +x.toFixed(2)), +(Math.asin(j[2]) * 180 / Math.PI).toFixed(1)]; });
  await step('dayNight', async () => { $('optOpen').click(); if ($('op').hidden) $('optOpen').click(); $('swDn').click(); await sleep(900); const on = $('swDn').getAttribute('aria-checked'), er = glErr(); $('swDn').click(); await sleep(50); return [on, er, $('swDn').getAttribute('aria-checked')]; });
  await step('regions', async () => { const t = performance.now(); $('swReg').click(); let n = 0; while (!w.WM.view.regions && n++ < 200) await sleep(25); await sleep(200); const v = w.WM.view.regions, r = { gold: v.gold.length, countries: v.countries.size, all: v.all.length, ms: Math.round(performance.now() - t), err: glErr(), stat: stat() }; $('swReg').click(); await sleep(300); r.off = w.WM.view.regions === null; return r; });
  await step('music', async () => { $('swMu').click(); await sleep(150); const on = $('swMu').getAttribute('aria-checked'); $('swMu').click(); await sleep(60); return [on, $('swMu').getAttribute('aria-checked')]; });
  await step('themes', async () => { const o = []; for (const k of ['atlas', 'glacier', 'ember', 'forest', 'gold']) { $('opTheme').value = k; $('opTheme').dispatchEvent(new w.Event('change')); await sleep(50); o.push(getComputedStyle(d.documentElement).getPropertyValue('--gold').trim()); } $('opTheme').value = 'forest'; $('opTheme').dispatchEvent(new w.Event('change')); await sleep(100); const t = cur().theme; await load(); const after = [getComputedStyle(d.documentElement).getPropertyValue('--gold').trim(), $('opTheme').value]; $('optOpen').click(); $('opTheme').value = 'gold'; $('opTheme').dispatchEvent(new w.Event('change')); await sleep(60); return { o, t, after, reset: cur().theme || 'none' }; });
  await step('poster', async () => { if ($('op').hidden) $('optOpen').click(); const W0 = d.getElementById('gl').width; $('opPoster').click(); let n = 0; while (!w.__posterBytes && n++ < 400) await sleep(25); await sleep(120); return { bytes: w.__posterBytes, restored: d.getElementById('gl').width === W0, btn: $('opPoster').textContent, err: glErr() }; });
  await step('want', async () => { $('edClose') && 0; $('addOpen').click(); [...d.querySelectorAll('.tabs button')].find(b => b.dataset.t === 's').click(); const s = stat(); $('q').value = 'tokyo'; $('q').dispatchEvent(new w.Event('input')); let n = 0; while (!$('res').querySelector('.row') && n++ < 200) await sleep(25); await sleep(40); const row = [...$('res').querySelectorAll('.row')].find(x => x.textContent.includes('Japan')); [...row.querySelectorAll('button')].find(b => b.textContent === 'Want').click(); await sleep(250); const p = cur().places.find(x => x.name === 'Tokyo'); const st = w.__stats; return { before: s, after: stat(), status: p && p.status, japan: cur().visitedCountries.includes('392') }; });
  await step('photos', async () => { const c = d.createElement('canvas'); c.width = 3000; c.height = 2000; const x = c.getContext('2d'); x.fillStyle = '#c33'; x.fillRect(0, 0, 3000, 2000); const b = await new Promise(r => c.toBlob(r, 'image/jpeg', .8)); [...d.querySelectorAll('.tabs button')].find(t => t.dataset.t === 'd').click(); $('dq').value = 'Dallas'; $('dq').dispatchEvent(new w.Event('input')); await sleep(30); $('dlist').querySelector('.act').click(); await sleep(50); const dt = new w.DataTransfer(); dt.items.add(new w.File([b], 'a.jpg', { type: 'image/jpeg' })); dt.items.add(new w.File([b], 'b.jpg', { type: 'image/jpeg' })); $('fPh').files = dt.files; $('fPh').dispatchEvent(new w.Event('change')); let n = 0; while ($('thumbs').children.length < 2 && n++ < 200) await sleep(25); const th = $('thumbs').children.length; $('fCancel').click(); $('edClose').click(); w.WM.onPinTap({ name: 'Dallas' }); await sleep(250); const open = !$('lb').hidden, nm = $('lbName').textContent, iw = $('lbImg').naturalWidth; $('lbNext').click(); await sleep(150); const nm2 = $('lbName').textContent; w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape' })); await sleep(30); return { th, open, nm, shrunkW: iw, nm2, closed: $('lb').hidden, inFile: JSON.stringify(cur()).includes('blob') }; });
  await step('share', async () => { $('optOpen').click(); if ($('op').hidden) $('optOpen').click(); $('opShare').click(); let n = 0; while (!w.__shareUrl && n++ < 200) await sleep(25); const url = w.__shareUrl, st = stat(), lsBefore = w.localStorage.getItem('wm-edits-v1'); await load(url); const a = !!d.body.classList.contains('shared'), hid = getComputedStyle($('addOpen')).display, s2 = stat(), hasNote = (cur().places.find(x => x.name === 'Atlanta') || {}).note; const same = w.localStorage.getItem('wm-edits-v1') === lsBefore; return { len: url.length, st, s2, a, hid, hasNote, same, want: (cur().places.find(x => x.name === 'Tokyo') || {}).status }; });
  await step('downloadFile', async () => { await load(); const e = w.__wmEffective(), keys = Object.keys(e); return { keys, n: e.places.length, photo: JSON.stringify(e).includes('photo') }; });
  await step('badShare', async () => { await load('../index.html?t=' + Date.now() + '#share=notvalid&spin=0'); return [stat(), d.body.classList.contains('shared')]; });
  await step('clean', async () => { await load(); w.localStorage.clear(); await new Promise(r => { const q = w.indexedDB.deleteDatabase('wm-photos'); q.onsuccess = q.onerror = q.onblocked = r; }); return 'done'; });
  fetch('/ALLF?' + encodeURIComponent(JSON.stringify(R)));
})();
</script>
